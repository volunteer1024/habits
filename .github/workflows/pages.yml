name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAGES: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Use GitHub Actions as Pages source
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo
            const body = { owner, repo, build_type: 'workflow' }
            try {
              await github.request('GET /repos/{owner}/{repo}/pages', { owner, repo })
              await github.request('PUT /repos/{owner}/{repo}/pages', body)
            } catch (error) {
              if (error.status === 404) {
                await github.request('POST /repos/{owner}/{repo}/pages', body)
                return
              }
              throw error
            }
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
